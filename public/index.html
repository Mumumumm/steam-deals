<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEAM DEALS — 할인 스캐너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10131a;
    --surface: #1a1f2b;
    --surface-hover: #222a3c;
    --paper: #e9ecf2;
    --fog: #8b93a6;
    --border: rgba(255,255,255,0.07);
    --accent: #4fc3d9;
    --accent-ink: #052026;
    --amber: #f2a641;
    --heat: #ef5350;
    --good: #6cc06c;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --font-display: 'Bricolage Grotesque', 'Segoe UI', sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --ink: #eef1f6;
      --surface: #ffffff;
      --surface-hover: #f3f6fa;
      --paper: #171b26;
      --fog: #5c6478;
      --border: rgba(15,23,42,0.08);
      --accent: #0d7f9b;
      --accent-ink: #ffffff;
      --amber: #b5720a;
      --heat: #d1403c;
      --good: #2e8b3d;
      --shadow: 0 8px 20px rgba(30,41,59,0.12);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--ink);
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  ::selection { background: var(--accent); color: var(--accent-ink); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 28px 28px 20px;
    flex-wrap: wrap;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mark {
    width: 30px;
    height: 30px;
    flex: none;
  }

  .titles h1 {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .titles p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--fog);
    letter-spacing: 0.02em;
  }

  #fetchedAt {
    font-size: 12px;
    color: var(--fog);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 22px;
    align-items: center;
    padding: 12px 28px;
    flex-wrap: wrap;
    background: color-mix(in srgb, var(--ink) 82%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fog);
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  select {
    background: var(--surface);
    color: var(--paper);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: var(--font-body);
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 140px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--ink);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--ink);
    cursor: pointer;
  }

  #minDiscountVal {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--accent);
    width: 2.4em;
  }

  .checkbox-row {
    font-size: 13px;
    color: var(--paper);
    cursor: pointer;
    height: 31px;
  }
  .checkbox-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }

  button#refresh {
    margin-left: auto;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  button#refresh:hover { filter: brightness(1.08); }
  button#refresh:disabled { opacity: 0.55; cursor: default; filter: none; }
  button#refresh svg { width: 14px; height: 14px; }
  button#refresh.spinning svg { animation: spin 0.8s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    button#refresh.spinning svg { animation: none; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #status {
    font-size: 12px;
    color: var(--fog);
    padding: 14px 28px 0;
    font-variant-numeric: tabular-nums;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
    padding: 16px 28px 48px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: var(--paper);
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .card:hover {
    background: var(--surface-hover);
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }

  .card-media {
    position: relative;
    background: var(--ink);
  }
  .card img {
    width: 100%;
    aspect-ratio: 231 / 87;
    object-fit: cover;
    display: block;
  }

  .tag {
    position: absolute;
    top: 10px;
    left: -6px;
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.01em;
    color: #0a0a0a;
    padding: 4px 12px 4px 14px;
    clip-path: polygon(0 50%, 10px 0, 100% 0, 100% 100%, 10px 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  }
  .tag.tier-low { background: var(--accent); color: var(--accent-ink); }
  .tag.tier-mid { background: var(--amber); color: #241300; }
  .tag.tier-high { background: var(--heat); color: #2b0000; }

  .record-badge {
    position: absolute;
    top: 42px;
    left: 8px;
    display: flex;
    align-items: center;
    gap: 3px;
    background: #ffd54a;
    color: #241a00;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.01em;
    padding: 3px 8px 3px 6px;
    border-radius: 4px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  }
  .record-badge svg { width: 10px; height: 10px; flex: none; }

  .card-body {
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .card-title {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.35;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .card-sub {
    font-size: 11.5px;
    color: var(--fog);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .genre-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .genre-chip {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--fog);
    background: color-mix(in srgb, var(--fog) 14%, transparent);
    border-radius: 4px;
    padding: 2px 6px;
  }

  .card-desc {
    font-size: 11.5px;
    color: var(--fog);
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .meta-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    color: var(--fog);
  }
  .mode-chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
  }

  .review-chip {
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    color: var(--rc);
    background: color-mix(in srgb, var(--rc) 18%, transparent);
  }
  .review-chip.rp4 { --rc: var(--good); }
  .review-chip.rp3 { --rc: color-mix(in srgb, var(--good) 85%, var(--fog)); }
  .review-chip.rp2 { --rc: color-mix(in srgb, var(--good) 65%, var(--fog)); }
  .review-chip.rp1 { --rc: color-mix(in srgb, var(--good) 45%, var(--fog)); }
  .review-chip.rn0 { --rc: var(--fog); }
  .review-chip.rn1 { --rc: color-mix(in srgb, var(--heat) 45%, var(--fog)); }
  .review-chip.rn2 { --rc: color-mix(in srgb, var(--heat) 65%, var(--fog)); }
  .review-chip.rn3 { --rc: color-mix(in srgb, var(--heat) 85%, var(--fog)); }
  .review-chip.rn4 { --rc: var(--heat); }
  .metacritic-chip {
    font-weight: 800;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    color: white;
  }
  .metacritic-chip.mc-high { background: #6c3; }
  .metacritic-chip.mc-mid { background: #fc3; color: #241300; }
  .metacritic-chip.mc-low { background: #f00; }

  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--fog);
    border-top: 1px dashed var(--border);
    padding-top: 6px;
    margin-top: 2px;
  }
  .delta-up { color: var(--heat); font-weight: 700; }
  .delta-down { color: var(--accent); font-weight: 700; }

  .price-row {
    margin-top: auto;
    padding-top: 6px;
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 8px;
    font-variant-numeric: tabular-nums;
  }

  .price-orig {
    font-size: 11.5px;
    color: var(--fog);
    text-decoration: line-through;
  }

  .price-final {
    font-size: 15px;
    font-weight: 800;
  }

  #empty {
    padding: 60px 28px;
    color: var(--fog);
    text-align: center;
    font-size: 14px;
  }

  #accessGate {
    max-width: 420px;
    margin: 60px auto;
    padding: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-align: center;
  }
  #accessGate p {
    color: var(--fog);
    font-size: 13px;
    margin: 0 0 14px;
  }
  #accessGate .field-row { justify-content: center; }
  #accessCodeInput {
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    width: 180px;
  }
  #accessCodeSubmit {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .skeleton-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .skeleton-card .sk-media { aspect-ratio: 231/87; background: var(--surface-hover); }
  .skeleton-card .sk-line { height: 10px; margin: 12px 14px; border-radius: 4px; background: var(--surface-hover); }
  .skeleton-card, .skeleton-card * { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) {
    .skeleton-card, .skeleton-card * { animation: none; }
  }

  .card { cursor: pointer; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 10, 0.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
    animation: overlay-in 0.15s ease;
  }
  .modal-overlay[hidden] { display: none; }
  @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    animation: modal-in 0.18s ease;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modal-overlay, .modal-card { animation: none; }
  }

  .modal-media { position: relative; background: var(--ink); }
  .modal-media img {
    width: 100%;
    aspect-ratio: 231 / 87;
    object-fit: cover;
    display: block;
  }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: white;
    border: none;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { background: rgba(0,0,0,0.75); }

  .modal-body {
    padding: 18px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 800;
    text-wrap: balance;
  }
  .modal-desc {
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--paper);
  }

  .modal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 10px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
  }
  .steam-link {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 9px 18px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
  }
  .steam-link:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 15 L15 4 L28 4 L28 17 L17 28 L4 15 Z" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="21.5" cy="10.5" r="2.6" fill="var(--accent)"/>
    </svg>
    <div class="titles">
      <h1>STEAM DEALS</h1>
      <p>실시간 할인 스캐너 · Steam 공식 검색 API 기반</p>
    </div>
  </div>
  <span id="fetchedAt"></span>
</header>

<div class="toolbar">
  <div class="field">
    <span class="field-label">정렬</span>
    <select id="sort">
      <option value="discount_desc">할인율 높은순</option>
      <option value="discount_asc">할인율 낮은순</option>
      <option value="price_asc">가격 낮은순</option>
      <option value="price_desc">가격 높은순</option>
      <option value="name">이름순</option>
    </select>
  </div>
  <div class="field">
    <span class="field-label">최소 할인율</span>
    <div class="field-row">
      <input type="range" id="minDiscount" min="0" max="90" step="5" value="0">
      <span id="minDiscountVal">0%</span>
    </div>
  </div>
  <div class="field">
    <span class="field-label">장르</span>
    <select id="genre">
      <option value="">전체</option>
    </select>
  </div>
  <div class="field">
    <span class="field-label">플레이 방식</span>
    <select id="playMode">
      <option value="">전체</option>
      <option value="single">싱글플레이어만</option>
      <option value="multi">멀티플레이어 포함</option>
    </select>
  </div>
  <div class="field">
    <span class="field-label">&nbsp;</span>
    <label class="field-row checkbox-row">
      <input type="checkbox" id="hideNegative">
      부정적 평가 게임 숨기기
    </label>
  </div>
  <button id="refresh">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.98M13.5 2v3.2h-3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    새로고침
  </button>
</div>

<div id="status"></div>

<div id="accessGate" style="display:none">
  <p id="accessGateMessage">이 사이트는 초대받은 사람만 볼 수 있어요. 받은 접근 코드를 입력해주세요.</p>
  <div class="field-row">
    <input type="text" id="accessCodeInput" placeholder="접근 코드" autocomplete="off">
    <button id="accessCodeSubmit">입장</button>
  </div>
</div>

<div id="grid"></div>
<div id="empty" style="display:none">조건에 맞는 게임이 없습니다. 최소 할인율을 낮춰보세요.</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-media">
      <img id="modalImage" src="" alt="">
      <span class="tag" id="modalTag"></span>
      <span class="record-badge" id="modalRecordBadge" style="display:none">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l2.09 4.26 4.7.68-3.4 3.31.8 4.68L8 11.77l-4.19 2.16.8-4.68L1.21 5.94l4.7-.68L8 1z"/></svg>
        역대 최저가 갱신
      </span>
      <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="genre-row" id="modalGenres"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="meta-row" id="modalMeta"></div>
      <div class="history-row" id="modalHistory"></div>
      <div class="modal-footer">
        <div class="price-row" id="modalPrice"></div>
        <a id="modalSteamLink" class="steam-link" href="#" target="_blank" rel="noopener noreferrer">
          Steam에서 보기 ↗
        </a>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
